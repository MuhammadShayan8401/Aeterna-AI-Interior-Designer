# Every 30 minutes: pings the Hugging Face Space (keeps the free Space awake) AND checks it answers correctly.
# If the check fails GitHub emails you ("Run failed"), which doubles as an uptime alert.
# Set the repository variable SPACE_URL, e.g. https://your-username-your-space.hf.space
name: keep-alive
on:
  schedule: [{ cron: "*/30 * * * *" }]
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake the Space
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 120 "${{ vars.SPACE_URL }}/" -o /dev/null
      - name: Health check (/ping)
        run: |
          r=$(curl -fsS --max-time 60 -X POST "${{ vars.SPACE_URL }}/gradio_api/call/ping" -H 'content-type: application/json' -d '{"data":[]}')
          id=$(echo "$r" | python3 -c 'import sys,json;print(json.load(sys.stdin)["event_id"])')
          curl -fsS --max-time 60 "${{ vars.SPACE_URL }}/gradio_api/call/ping/$id" | grep -q '"ok": *true'
